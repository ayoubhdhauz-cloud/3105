name: Build 3105 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest Xcode
        run: |
          XCODE=$(ls /Applications/ | grep "^Xcode" | sort -V | tail -n 1)
          echo "Using: $XCODE"
          sudo xcode-select -s /Applications/$XCODE
          xcodebuild -version

      # เช็คชื่อ scheme จริงๆ
      - name: List schemes
        run: xcodebuild -list -project ThreeOneOSFive.xcodeproj

      # ดึงชื่อ scheme แรกที่มีอยู่จริง แล้ว build
      - name: Build unsigned .app
        run: |
          set -o pipefail

          # ดึงชื่อ scheme อัตโนมัติ
          SCHEME=$(xcodebuild -list -project ThreeOneOSFive.xcodeproj 2>/dev/null \
            | awk '/Schemes:/,0' \
            | grep -v "Schemes:" \
            | grep -v "^$" \
            | head -n 1 \
            | xargs)

          echo "==> ใช้ scheme: '$SCHEME'"

          xcodebuild build \
            -project ThreeOneOSFive.xcodeproj \
            -scheme "$SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS="arm64" \
            EXCLUDED_ARCHS="i386 armv7" \
            PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0

      - name: Show build output
        if: always()
        run: |
          echo "==> RUNNER_TEMP = $RUNNER_TEMP"
          find "$RUNNER_TEMP" -maxdepth 6 -name "*.app" 2>/dev/null || echo "ไม่พบ .app"

      - name: Package unsigned .ipa
        run: |
          set -e
          APP_PATH=$(find "$RUNNER_TEMP" -type d -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "ไม่พบ .app bundle" >&2
            exit 1
          fi
          echo "พบ: $APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qr "3105-unsigned.ipa" "Payload"
          mkdir -p ipa_out
          mv "3105-unsigned.ipa" ipa_out/
          echo "✅ IPA พร้อมแล้ว"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-ipa
          path: ${{ runner.temp }}/ipa_out/3105-unsigned.ipa
          retention-days: 7
